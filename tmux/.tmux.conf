# Keep the default prefix (Ctrl+b) — deliberately not remapping it.
# It doesn't touch Kitty's Ctrl+Shift at all, and if you keep the same
# .tmux.conf on your home server later, the muscle memory travels with you.

# Vi-style keys for copy-mode (scrolling/searching output) — matches nvim/yazi
setw -g mode-keys vi

# Mouse support — handy for resizing panes without memorizing resize keys yet
set -g mouse on

# Saner, mnemonic split keys (open in the current pane's working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation with hjkl — same fingers as nvim and Yazi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick reload while you're iterating on this file
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Start pane/window numbering at 1 (0 is an awkward reach)
set -g base-index 1
setw -g pane-base-index 1

# nvim inside tmux has a noticeable lag leaving insert mode without this —
# tmux's default 500ms escape-time fights with vim's own Esc handling
set -sg escape-time 0

# Correct terminal type + truecolor passthrough, so your nvim colorscheme
# looks the same inside tmux as it does bare in Kitty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Copy-mode output to the system clipboard (Wayland) — without this,
# anything you copy in tmux's copy-mode stays trapped inside tmux
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

set -g default-command /usr/bin/fish
