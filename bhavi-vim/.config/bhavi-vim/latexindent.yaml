#     level: 6

# 1. DEFINE YOUR INDENT SIZE HERE (e.g., 4 spaces or a tab "\t")
defaultIndent: "   "

indentAfterHeadings:
  part:
    indentAfterThisHeading: 2 # Increased to 2 for a larger indent
    level: 1
  chapter:
    indentAfterThisHeading: 2
    level: 2
  section:
    indentAfterThisHeading: 2
    level: 3
  subsection:
    indentAfterThisHeading: 2
    level: 4
  subsubsection:
    indentAfterThisHeading: 2
    level: 5
  paragraph:
    indentAfterThisHeading: 2
    level: 6

# 2. ADD BLANK LINES BEFORE SECTIONS
modifyLineBreaks:
  headings:
    section:
      BeforeStartsOnOwnLine: 2 # '2' means 1 blank line before the heading
    subsection:
      BeforeStartsOnOwnLine: 2

# 3. FIX \end{document} INDENTATION
environments:
  document:
    indent: 0 # Forces \begin{document} and \end{document} to snap to the left margin
    beginStartsOnOwnLine: 1
    endStartsOnOwnLine: 1
